name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Rebuild demo and check generated tests still pass
        run: |
          ruleforge build examples/lumbar_mri/policy.md --dict examples/lumbar_mri/data_dictionary.json \
            --cassette examples/lumbar_mri/cassettes/demo.json --out /tmp/out
          ruleforge test /tmp/out/rules.json --cases /tmp/out/test_cases.json
