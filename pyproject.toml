[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleforge"
version = "0.1.0"
description = "Compile payer policy text into verified, executable decision rules with MC/DC tests and conflict detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ruleforge = "ruleforge.cli:main"

[tool.setuptools]
packages = ["ruleforge"]
